<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagebound — Reader</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0906;--surface:#16100a;--amber:#d4893c;--amber-light:#f0a84e;
  --cream:#f5ede0;--text:#e8ddd0;--text-dim:#8a7258;--border:rgba(184,148,104,.2);
  --bar-h:52px;--nav-h:48px;
  --page-bg:#1a120a;--page-text:#d4c4ae;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overflow:hidden;}
body{display:flex;flex-direction:column;}

/* ── TOP BAR ── */
.bar{height:var(--bar-h);background:rgba(13,9,6,.97);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 .9rem;gap:.6rem;flex-shrink:0;z-index:100;
  backdrop-filter:blur(10px);}
.bar-back{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;
  padding:.32rem .75rem;font-size:.76rem;color:var(--text-dim);cursor:pointer;
  text-decoration:none;transition:background .15s;white-space:nowrap;}
.bar-back:hover{background:rgba(255,255,255,.12);color:var(--cream);}
.bar-info{flex:1;min-width:0;margin:0 .4rem;}
.bar-title{font-family:'Playfair Display',serif;font-size:.88rem;font-weight:700;
  color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-author{font-size:.66rem;color:var(--text-dim);}
.bar-btns{display:flex;align-items:center;gap:.3rem;flex-shrink:0;}
.bb{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:7px;
  padding:.28rem .6rem;font-size:.72rem;color:var(--text-dim);cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.bb:hover{background:rgba(255,255,255,.1);color:var(--cream);}
.bb.on{background:var(--amber);color:#060408;border-color:var(--amber);}
.bsep{width:1px;height:18px;background:var(--border);flex-shrink:0;}

/* ── MAIN LAYOUT ── */
.main{flex:1;display:flex;overflow:hidden;position:relative;}

/* ── TOC SIDEBAR ── */
.toc{width:0;overflow:hidden;background:var(--surface);border-right:1px solid var(--border);
  transition:width .25s;flex-shrink:0;}
.toc.open{width:220px;}
.toc-inner{width:220px;padding:.7rem;overflow-y:auto;height:100%;}
.toc-head{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--text-dim);margin-bottom:.5rem;}
.toc-item{display:block;padding:.4rem .55rem;font-size:.75rem;color:var(--text-dim);
  border-radius:6px;cursor:pointer;transition:background .15s,color .15s;line-height:1.3;}
.toc-item:hover{background:rgba(255,255,255,.06);color:var(--cream);}
.toc-item.cur{background:rgba(212,137,60,.12);color:var(--amber);}

/* ── READER STAGE ── */
.stage{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* ── PAGE VIEWPORT ── */
.page-viewport{
  flex:1;
  overflow:hidden;
  position:relative;
  cursor:default;
  user-select:none;
  -webkit-user-select:none;
}

/* The book page itself */
.page-surface{
  position:absolute;
  top:1.5rem;
  bottom:1.5rem;
  left:50%;
  transform:translateX(-50%);
  width:min(480px, calc(100% - 3rem));
  background:var(--page-bg);
  padding:3rem 3rem 1.5rem;
  overflow:hidden;
  border-radius:3px 8px 8px 3px;
  box-shadow:
    -5px 0 10px rgba(0,0,0,.5),
    3px 0 20px rgba(0,0,0,.4),
    0 6px 32px rgba(0,0,0,.6);
}

/* Column-based pagination: content is split into columns the width of the viewport */
.page-columns{
  position:absolute;
  top:3rem;
  bottom:1.5rem;
  left:3rem;
  right:3rem;
  column-fill:auto;
  overflow:hidden;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}

/* Text styles */
.page-columns h1,.page-columns h2,.page-columns h3{
  font-family:'Playfair Display',serif;color:var(--cream);
  margin-bottom:.7rem;margin-top:1.5rem;line-height:1.25;
  break-after:avoid;column-span:none;
}
.page-columns h1{font-size:1.45rem;margin-top:0;}
.page-columns h2{font-size:1.15rem;}
.page-columns h3{font-size:.98rem;}
.page-columns p{
  margin-bottom:.9rem;
  text-indent:1.4em;
  orphans:3;widows:3;
  break-inside:avoid;
}
.page-columns p:first-child,.page-columns p.no-indent{text-indent:0;}
.page-columns img{
  max-width:100%;max-height:60%;
  display:block;margin:.8rem auto;
  border-radius:4px;
  break-inside:avoid;
}
.page-columns blockquote{
  border-left:3px solid var(--amber);padding-left:.9rem;
  color:var(--text-dim);font-style:italic;margin:.8rem 0;
  break-inside:avoid;
}
.page-columns a{color:var(--amber);text-decoration:none;}
.page-columns hr{border:none;border-top:1px solid var(--border);margin:1rem 0;}

/* Click zones */
.click-prev{position:absolute;left:0;top:0;width:25%;height:100%;cursor:w-resize;z-index:10;}
.click-next{position:absolute;right:0;top:0;width:25%;height:100%;cursor:e-resize;z-index:10;}
/* Page viewport - the desk around the book */
.page-viewport{flex:1;overflow:hidden;position:relative;cursor:default;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse at center,#1a1008 0%,#0d0906 100%);}

/* Page turn animation */
.page-columns.slide-left{animation:slideLeft .22s ease forwards;}
.page-columns.slide-right{animation:slideRight .22s ease forwards;}
@keyframes slideLeft{
  from{transform:translateX(0);opacity:1;}
  to{transform:translateX(-4%);opacity:0;}
}
@keyframes slideRight{
  from{transform:translateX(0);opacity:1;}
  to{transform:translateX(4%);opacity:0;}
}

/* ── BOTTOM NAV ── */
.nav-bar{height:var(--nav-h);background:rgba(13,9,6,.85);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.2rem;flex-shrink:0;}
.nav-btn{display:flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.05);
  border:1px solid var(--border);border-radius:8px;padding:.38rem .85rem;
  font-family:'DM Sans',sans-serif;font-size:.76rem;color:var(--text-dim);cursor:pointer;
  transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;}
.nav-btn:hover:not(:disabled){background:rgba(255,255,255,.1);color:var(--cream);}
.nav-btn:disabled{opacity:.25;cursor:default;}
.nav-center{text-align:center;flex:1;}
.nav-chapter{font-size:.76rem;font-weight:600;color:var(--cream);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.nav-page-info{font-size:.63rem;color:var(--text-dim);margin-top:.15rem;}
.progress-track{width:80px;height:3px;background:rgba(255,255,255,.1);
  border-radius:3px;overflow:hidden;margin:.2rem auto 0;}
.progress-fill{height:100%;background:var(--amber);border-radius:3px;transition:width .35s;}

/* ── LOADING / ERROR ── */
.overlay{position:absolute;inset:0;background:var(--bg);z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;}
.ov-cover{width:65px;height:98px;border-radius:3px 9px 9px 3px;
  animation:fl 2s ease-in-out infinite;box-shadow:4px 6px 20px rgba(0,0,0,.7);}
@keyframes fl{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.ov-bar{width:150px;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.ov-bar-fill{height:100%;background:var(--amber);border-radius:3px;
  animation:lp 1.6s ease-in-out infinite;}
@keyframes lp{0%{width:0;margin-left:0;}60%{width:60%;margin-left:20%;}100%{width:0;margin-left:100%;}}
#ov-msg{font-size:.8rem;color:var(--text-dim);text-align:center;line-height:1.6;}
.err-overlay{position:absolute;inset:0;background:var(--bg);z-index:50;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:.7rem;padding:2rem;text-align:center;}
.err-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--cream);}
.err-msg{font-size:.8rem;color:var(--text-dim);line-height:1.65;max-width:400px;white-space:pre-line;}
.err-back{color:var(--amber);text-decoration:none;font-size:.82rem;}
.err-retry{margin-top:.4rem;background:var(--amber);border:none;border-radius:8px;
  padding:.46rem 1.3rem;font-family:'DM Sans',sans-serif;font-size:.82rem;
  font-weight:700;color:#060408;cursor:pointer;}

/* ── TOAST ── */
.toast{position:fixed;bottom:4rem;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--amber);color:#060408;border-radius:10px;padding:.45rem 1.1rem;
  font-size:.76rem;font-weight:700;opacity:0;transition:opacity .22s,transform .22s;
  pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── THEMES ── */
body.sepia{--page-bg:#f4ecd8;--page-text:#3a2a14;}
body.sepia .page-surface{background:var(--page-bg);}
body.sepia .page-columns{color:var(--page-text);}
body.sepia .page-columns h1,body.sepia .page-columns h2,body.sepia .page-columns h3{color:#1a0e04;}
body.night{--page-bg:#0c0c0c;--page-text:#aaaaaa;}
body.night .page-surface{background:var(--page-bg);}
body.night .page-columns{color:var(--page-text);}

/* ── ZOOM MODE — full width, scrollable ── */
body.zoom-mode .page-surface{
  width:calc(100% - 3rem);
  top:1.5rem;
  bottom:auto;
  min-height:calc(100% - 3rem);
  border-radius:8px;
}
body.zoom-mode .page-viewport{
  overflow-y:auto;
  overflow-x:hidden;
}
body.zoom-mode .page-columns{
  position:static;
  height:auto;
  overflow:visible;
  padding-bottom:2rem;
}
body.zoom-mode .click-prev,
body.zoom-mode .click-next{display:none;}
body.zoom-mode .nav-bar{display:none !important;}

@media(max-width:600px){
  .bar-author,.bsep,.bb:not(.bb-toc){display:none;}
  .page-surface{top:.5rem;bottom:.5rem;width:calc(100% - 1rem);border-radius:4px;padding:1.8rem 1.4rem 1rem;}
  .page-columns{top:1.8rem;bottom:1rem;left:1.4rem;right:1.4rem;}
  .toc.open{width:185px;}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="bar">
  <a class="bar-back" href="index.html">← Library</a>
  <div class="bar-info">
    <div class="bar-title" id="bar-title">Loading…</div>
    <div class="bar-author" id="bar-author"></div>
  </div>
  <div class="bar-btns">
    <button class="bb bb-toc" onclick="toggleToc()">☰</button>
    <div class="bsep"></div>
    <button class="bb" onclick="changeFontSize(-1)">A−</button>
    <button class="bb" onclick="changeFontSize(1)">A+</button>
    <div class="bsep"></div>
    <button class="bb" id="th-default" onclick="setTheme('default')">🌙</button>
    <button class="bb" id="th-sepia"   onclick="setTheme('sepia')">📜</button>
    <button class="bb" id="th-night"   onclick="setTheme('night')">⬛</button>
    <div class="bsep"></div>
    <button class="bb" id="btn-zoom" onclick="toggleZoom()" title="Fit to screen width">🔍</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOC -->
  <div class="toc" id="toc-panel">
    <div class="toc-inner">
      <div class="toc-head">Contents</div>
      <div id="toc-list"></div>
    </div>
  </div>

  <!-- STAGE -->
  <div class="stage">

    <!-- Loading overlay -->
    <div class="overlay" id="ov-loading">
      <div class="ov-cover" id="ov-cover"></div>
      <div class="ov-bar"><div class="ov-bar-fill"></div></div>
      <div id="ov-msg">Loading…</div>
    </div>

    <!-- Error overlay -->
    <div class="err-overlay" id="ov-error">
      <div style="font-size:2.5rem;opacity:.5">📚</div>
      <div class="err-title">Book not available</div>
      <div class="err-msg" id="err-msg-text">Could not load this book.</div>
      <a class="err-back" href="index.html">← Back to Library</a>
      <button class="err-retry" onclick="retryLoad()">↺ Retry</button>
    </div>

    <!-- Page viewport -->
    <div class="page-viewport" id="page-viewport">
      <div class="page-surface">
        <div class="page-columns" id="page-columns"></div>
      </div>
      <!-- Click zones for prev/next -->
      <div class="click-prev" onclick="prevPage()"></div>
      <div class="click-next" onclick="nextPage()"></div>
    </div>

    <!-- Bottom nav -->
    <div class="nav-bar" id="nav-bar" style="display:none">
      <button class="nav-btn" id="btn-prev" onclick="prevPage()">‹ Back</button>
      <div class="nav-center">
        <div class="nav-chapter" id="nav-chapter-title"></div>
        <div class="nav-page-info" id="nav-page-info"></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <button class="nav-btn" id="btn-next" onclick="nextPage()">Next ›</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   FIREBASE
═══════════════════════════════════════════ */
const FB={apiKey:"AIzaSyCTfeRsHZHr8NKrZPTSoDhG0LcgxA3mtzU",authDomain:"casey-80b19.firebaseapp.com",databaseURL:"https://casey-80b19-default-rtdb.firebaseio.com",projectId:"casey-80b19",storageBucket:"casey-80b19.firebasestorage.app",messagingSenderId:"1084195161725",appId:"1:1084195161725:web:c4db255376c0aaf25d5314"};
firebase.initializeApp(FB);
const db=firebase.database();
function getSession(){try{return JSON.parse(localStorage.getItem('pb_session')||'null');}catch{return null;}}
const SESSION=getSession();

/* ═══════════════════════════════════════════
   URL PARAMS
═══════════════════════════════════════════ */
const P         = new URLSearchParams(window.location.search);
const EPUB_KEY  = P.get('key')||'';
const TITLE     = P.get('title')||'';
const AUTHOR    = P.get('author')||'';
const COLOR     = P.get('color')||'linear-gradient(160deg,#3d2810,#6e4820)';
const SAVE_KEY  = 'pb_pos_'+(EPUB_KEY||'x');

document.getElementById('bar-title').textContent  = TITLE||'Loading…';
document.getElementById('bar-author').textContent = AUTHOR||'';
document.getElementById('ov-cover').style.background = COLOR;
document.title = TITLE ? TITLE+' — Pagebound' : 'Pagebound';

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let zip=null, spine=[], toc=[], opfDir='';
let chapterPages=[];  // array of HTML strings, one per page
let globalPages=[];   // [{html, chapterIdx, pageInChapter}]
let curPage=0;
let fontSize=100;
let curTheme='default';
let rendering=false;

/* ═══════════════════════════════════════════
   LOAD FROM FIREBASE
═══════════════════════════════════════════ */
function setMsg(m){document.getElementById('ov-msg').textContent=m;}

function showError(msg){
  document.getElementById('ov-loading').style.display='none';
  const e=document.getElementById('ov-error');
  e.style.display='flex';
  document.getElementById('err-msg-text').textContent=msg;
}

function retryLoad(){
  document.getElementById('ov-error').style.display='none';
  document.getElementById('ov-loading').style.display='flex';
  loadEpub();
}

async function loadEpub(){
  if(!EPUB_KEY){showError('No book key provided.');return;}

  const keys=[EPUB_KEY,EPUB_KEY.toLowerCase().replace(/[^a-z0-9]/g,'_'),TITLE.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').substring(0,40)].filter((k,i,a)=>k&&a.indexOf(k)===i);

  let meta=null,rk='';
  setMsg('Connecting…');
  for(const k of keys){
    try{const s=await db.ref('pb_books_epub/'+k+'/meta').once('value');if(s.val()){meta=s.val();rk=k;break;}}catch(e){}
  }
  if(!meta){showError('No epub found for this book.\nUpload the epub from the admin page.');return;}

  const chunks=meta.chunks||1;
  setMsg('Loading book…');
  const parts=[];let total=0;
  for(let i=0;i<chunks;i++){
    setMsg(`Loading ${i+1}/${chunks}…`);
    try{
      const s=await db.ref('pb_books_epub/'+rk+'/chunk_'+i).once('value');
      const b64=s.val();if(!b64)throw new Error('chunk missing');
      const bin=atob(b64);const bytes=new Uint8Array(bin.length);
      for(let j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);
      parts.push(bytes);total+=bytes.length;
    }catch(e){showError('Failed chunk '+(i+1)+': '+e.message);return;}
  }
  const merged=new Uint8Array(total);let off=0;
  for(const p of parts){merged.set(p,off);off+=p.length;}

  setMsg('Parsing epub…');
  try{zip=await JSZip.loadAsync(merged.buffer);}
  catch(e){showError('Cannot parse epub: '+e.message);return;}

  setMsg('Reading chapters…');
  try{await parseEpub();}
  catch(e){showError('Epub structure error: '+e.message);return;}

  setMsg('Paginating…');
  await buildPages();

  // Restore saved position
  const saved=parseInt(localStorage.getItem(SAVE_KEY)||'0');
  curPage=Number.isFinite(saved)&&saved>=0&&saved<globalPages.length?saved:0;

  document.getElementById('ov-loading').style.display='none';
  document.getElementById('nav-bar').style.display='flex';
  renderPage(curPage);
}

/* ═══════════════════════════════════════════
   EPUB PARSING
═══════════════════════════════════════════ */
async function parseEpub(){
  const containerXml=await zip.file('META-INF/container.xml').async('text');
  const opfMatch=containerXml.match(/full-path="([^"]+\.opf)"/i);
  if(!opfMatch)throw new Error('OPF not found');
  const opfPath=opfMatch[1];
  opfDir=opfPath.includes('/')?opfPath.substring(0,opfPath.lastIndexOf('/')+1):'';
  const opfText=await zip.file(opfPath).async('text');
  const opfDoc=new DOMParser().parseFromString(opfText,'application/xml');
  const manifest={};
  opfDoc.querySelectorAll('manifest item').forEach(i=>manifest[i.getAttribute('id')]=i.getAttribute('href'));
  spine=[];
  opfDoc.querySelectorAll('spine itemref').forEach(ref=>{
    const href=manifest[ref.getAttribute('idref')];
    if(href)spine.push({href:opfDir+href,title:''});
  });
  if(!spine.length)throw new Error('No chapters in spine');
  await parseToc(opfDoc,manifest);
}

async function parseToc(opfDoc,manifest){
  let navItem=null;
  opfDoc.querySelectorAll('manifest item').forEach(i=>{if(i.getAttribute('properties')==='nav')navItem=i;});
  if(navItem){
    try{
      const navDoc=new DOMParser().parseFromString(await zip.file(opfDir+navItem.getAttribute('href')).async('text'),'text/html');
      toc=[];
      navDoc.querySelectorAll('nav a,nav li a').forEach(a=>{
        const base=(a.getAttribute('href')||'').split('#')[0];
        const si=spine.findIndex(s=>s.href.endsWith(base)||s.href===opfDir+base);
        toc.push({label:a.textContent.trim(),si:si>=0?si:0});
        if(si>=0&&!spine[si].title)spine[si].title=a.textContent.trim();
      });
    }catch(e){}
  }
  if(!toc.length){
    const ncxId=opfDoc.querySelector('spine')?.getAttribute('toc');
    if(ncxId&&manifest[ncxId]){
      try{
        const ncxDoc=new DOMParser().parseFromString(await zip.file(opfDir+manifest[ncxId]).async('text'),'application/xml');
        toc=[];
        ncxDoc.querySelectorAll('navPoint').forEach(np=>{
          const label=np.querySelector('navLabel text')?.textContent?.trim()||'';
          const base=(np.querySelector('content')?.getAttribute('src')||'').split('#')[0];
          const si=spine.findIndex(s=>s.href.endsWith(base)||s.href===opfDir+base);
          toc.push({label,si:si>=0?si:0});
          if(si>=0&&!spine[si].title)spine[si].title=label;
        });
      }catch(e){}
    }
  }
  spine.forEach((s,i)=>{if(!s.title)s.title='Chapter '+(i+1);});
  buildTocSidebar();
}

function buildTocSidebar(){
  const items=toc.length?toc:spine.map((s,i)=>({label:s.title,si:i}));
  document.getElementById('toc-list').innerHTML=items.map((it,i)=>
    `<div class="toc-item" id="ti${i}" onclick="gotoChapter(${it.si})">${escHtml(it.label)}</div>`
  ).join('');
}

function gotoChapter(si){
  // Find first page of this chapter
  const pg=globalPages.findIndex(p=>p.ci===si);
  if(pg>=0)renderPage(pg);
  if(window.innerWidth<700)document.getElementById('toc-panel').classList.remove('open');
}

/* ═══════════════════════════════════════════
   PAGINATION ENGINE
   Uses an off-screen div to measure content
   then slices it into page-sized chunks
═══════════════════════════════════════════ */
async function buildPages(){
  globalPages=[];

  // Measure the actual book surface (not the full viewport)
  const vp=document.getElementById('page-viewport');
  const surface=vp.querySelector('.page-surface');
  const pageW=surface.clientWidth||Math.min(480,vp.clientWidth-48);
  const pageH=surface.clientHeight||(vp.clientHeight-48);
  const padH=96; // top 3rem + bottom 1.5rem ≈ 48+24=72 → use 96 for safety
  const padW=96; // left+right 3rem*2
  const contentH=pageH-padH;
  const contentW=pageW-padW;

  // Off-screen measurement container
  const measure=document.createElement('div');
  measure.style.cssText=`position:fixed;top:-9999px;left:-9999px;width:${contentW}px;visibility:hidden;font-family:Merriweather,serif;font-size:${fontSize}%;line-height:1.85;color:#000;`;
  document.body.appendChild(measure);

  for(let ci=0;ci<spine.length;ci++){
    setMsg(`Paginating chapter ${ci+1}/${spine.length}…`);
    let html='';
    try{
      const f=zip.file(spine[ci].href)||zip.file(spine[ci].href.replace(/^\//,''));
      if(f){
        const raw=await f.async('text');
        const doc=new DOMParser().parseFromString(raw,'text/html');
        doc.querySelectorAll('script,style,link,head').forEach(el=>el.remove());
        // Inline images as base64
        const imgs=doc.querySelectorAll('img');
        await Promise.all([...imgs].map(async img=>{
          const src=img.getAttribute('src')||'';
          if(src.startsWith('data:')||src.startsWith('http'))return;
          const chDir=spine[ci].href.includes('/')?spine[ci].href.substring(0,spine[ci].href.lastIndexOf('/')+1):'';
          let ip=src.startsWith('/')?src.slice(1):chDir+src;
          ip=ip.replace(/[^/]+\/\.\.\//g,'');
          const imgFile=zip.file(ip);
          if(imgFile){
            try{
              const ext=ip.split('.').pop().toLowerCase();
              const mime=ext==='png'?'image/png':ext==='gif'?'image/gif':'image/jpeg';
              img.src=`data:${mime};base64,${await imgFile.async('base64')}`;
            }catch(e){img.remove();}
          }else{img.remove();}
        }));
        html=doc.body?doc.body.innerHTML:'';
      }
    }catch(e){html=`<p>Chapter ${ci+1}</p>`;}

    if(!html.trim())continue;

    // Slice into pages using scroll height measurement
    measure.innerHTML=html;
    const children=[...measure.children];
    if(!children.length){
      globalPages.push({html,ci,pi:0});
      continue;
    }

    let pageHtml='';
    let usedH=0;

    for(let n=0;n<children.length;n++){
      const ch=children[n];
      const elH=ch.offsetHeight||20;
      if(usedH+elH>contentH&&pageHtml){
        globalPages.push({html:pageHtml,ci,pi:globalPages.filter(p=>p.ci===ci).length});
        pageHtml=ch.outerHTML;
        usedH=elH;
      } else {
        pageHtml+=ch.outerHTML;
        usedH+=elH;
      }
    }
    if(pageHtml)globalPages.push({html:pageHtml,ci,pi:globalPages.filter(p=>p.ci===ci).length});

    // Yield to browser between chapters
    await new Promise(r=>setTimeout(r,0));
  }

  document.body.removeChild(measure);
  if(!globalPages.length)globalPages.push({html:'<p>No content found.</p>',ci:0,pi:0});
}

/* ═══════════════════════════════════════════
   RENDER PAGE
═══════════════════════════════════════════ */
function renderPage(idx,dir){
  if(idx<0||idx>=globalPages.length||rendering)return;
  rendering=true;
  const col=document.getElementById('page-columns');
  const pg=globalPages[idx];
  curPage=idx;

  // Animate out
  if(dir){
    col.classList.add(dir==='next'?'slide-left':'slide-right');
    setTimeout(()=>{
      col.classList.remove('slide-left','slide-right');
      col.innerHTML=pg.html;
      col.style.opacity='0';
      col.style.transform=dir==='next'?'translateX(4%)':'translateX(-4%)';
      requestAnimationFrame(()=>{
        col.style.transition='opacity .22s ease,transform .22s ease';
        col.style.opacity='1';
        col.style.transform='';
        setTimeout(()=>{col.style.transition='';rendering=false;},240);
      });
    },220);
  } else {
    col.innerHTML=pg.html;
    rendering=false;
  }

  // Save position
  localStorage.setItem(SAVE_KEY,String(idx));
  if(SESSION&&db){
    db.ref('pb_reading_progress/'+SESSION.username.replace(/\./g,'_')+'/'+EPUB_KEY)
      .set({page:idx,total:globalPages.length,pct:Math.round(idx/globalPages.length*100),updatedAt:Date.now()})
      .catch(()=>{});
  }

  updateNavBar(pg);
  updateTocHighlight(pg.ci);
}

function updateNavBar(pg){
  document.getElementById('nav-chapter-title').textContent=spine[pg.ci]?.title||'';
  const pagesInChapter=globalPages.filter(p=>p.ci===pg.ci).length;
  document.getElementById('nav-page-info').textContent=`Page ${pg.pi+1} of ${pagesInChapter} · Chapter ${pg.ci+1}/${spine.length}`;
  const pct=globalPages.length>1?Math.round(curPage/(globalPages.length-1)*100):100;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('btn-prev').disabled=curPage===0;
  document.getElementById('btn-next').disabled=curPage===globalPages.length-1;
}

function updateTocHighlight(ci){
  const items=toc.length?toc:spine.map((_,i)=>({si:i}));
  document.querySelectorAll('.toc-item').forEach((el,i)=>{
    el.classList.toggle('cur',items[i]?.si===ci);
  });
}

function prevPage(){if(curPage>0)renderPage(curPage-1,'prev');}
function nextPage(){if(curPage<globalPages.length-1)renderPage(curPage+1,'next');}

/* ═══════════════════════════════════════════
   UI
═══════════════════════════════════════════ */
function toggleToc(){document.getElementById('toc-panel').classList.toggle('open');}

function changeFontSize(d){
  fontSize=Math.max(75,Math.min(150,fontSize+(d*10)));
  document.getElementById('page-columns').style.fontSize=fontSize+'%';
  showToast('Font: '+fontSize+'%');
  // Rebuild pages with new font size
  if(globalPages.length){
    const savedCi=globalPages[curPage]?.ci||0;
    document.getElementById('ov-loading').style.display='flex';
    document.getElementById('nav-bar').style.display='none';
    setMsg('Repaginating…');
    buildPages().then(()=>{
      const pg=globalPages.findIndex(p=>p.ci===savedCi);
      curPage=pg>=0?pg:0;
      document.getElementById('ov-loading').style.display='none';
      document.getElementById('nav-bar').style.display='flex';
      renderPage(curPage);
    });
  }
}

function setTheme(t){
  curTheme=t;
  document.body.className=(document.body.classList.contains('zoom-mode')?'zoom-mode ':'')+( t==='default'?'':t);
  ['default','sepia','night'].forEach(n=>document.getElementById('th-'+n).classList.toggle('on',n===t));
}

let zoomMode=false;
function toggleZoom(){
  zoomMode=!zoomMode;
  const btn=document.getElementById('btn-zoom');
  btn.classList.toggle('on',zoomMode);
  btn.title=zoomMode?'Back to page view':'Fit to screen width';

  if(zoomMode){
    // Zoom mode: show full chapter as scrollable text
    const body=document.body;
    // Keep current theme class, add zoom-mode
    body.classList.add('zoom-mode');
    // Render full chapter content (not paginated)
    renderChapterFull(globalPages[curPage]?.ci||0);
    document.getElementById('nav-bar').style.display='none';
    document.getElementById('page-viewport').style.overflowY='auto';
  } else {
    // Back to page mode
    document.body.classList.remove('zoom-mode');
    const col=document.getElementById('page-columns');
    col.style.position='';col.style.height='';col.style.overflow='';col.style.padding='';
    document.getElementById('page-viewport').style.overflowY='';
    document.getElementById('nav-bar').style.display='flex';
    renderPage(curPage);
  }
  showToast(zoomMode?'🔍 Scroll mode — full chapter':'📖 Page mode — fits screen');
}

async function renderChapterFull(ci){
  if(!spine[ci]) return;
  const col=document.getElementById('page-columns');
  // Collect all pages for this chapter and join them
  const chPages=globalPages.filter(p=>p.ci===ci);
  if(chPages.length){
    col.innerHTML=chPages.map(p=>p.html).join('');
  } else {
    // Load raw chapter
    try{
      const f=zip.file(spine[ci].href)||zip.file(spine[ci].href.replace(/^\//,''));
      if(f){
        const raw=await f.async('text');
        const doc=new DOMParser().parseFromString(raw,'text/html');
        doc.querySelectorAll('script,style,link,head').forEach(el=>el.remove());
        col.innerHTML=doc.body?doc.body.innerHTML:'';
      }
    }catch(e){ col.innerHTML='<p>Could not load chapter.</p>'; }
  }
  // Scroll to top
  document.getElementById('page-viewport').scrollTo({top:0,behavior:'instant'});
}

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),2000);}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')nextPage();
  if(e.key==='ArrowLeft')prevPage();
});
// Swipe
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){if(dx<0)nextPage();else prevPage();}
},{passive:true});

loadEpub();
</script>
