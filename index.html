<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pagebound — Discover Books</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script>
/* ════════════════════════════════════════════
   PREMIUM SYSTEM
════════════════════════════════════════════ */
let _isPremium   = false;
let _pmPlan      = 'annual';

/* ── check on load ── */
function initPremium(){
  const sess = _getSession();
  if(!sess) return;
  const uk = sess.username.replace(/\./g,'_');
  // Check localStorage first (instant)
  if(localStorage.getItem('pb_premium_'+uk)==='true'){
    _isPremium = true;
    _applyPremiumUI();
    return;
  }
  // Check Firebase as fallback (async)
  if(typeof _fbDb !== 'undefined' && _fbDb){
    _fbDb.ref('pb_premium/'+uk).once('value').then(snap=>{
      const data = snap.val();
      if(data && data.active){
        _isPremium = true;
        localStorage.setItem('pb_premium_'+uk,'true');
        _applyPremiumUI();
      }
    }).catch(()=>{});
  }
}
// Run after DOM is fully ready
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initPremium);
} else {
  setTimeout(initPremium, 0);
}

function _applyPremiumUI(){
  const lbl = document.getElementById('_dd-premium-label');
  const btn  = document.getElementById('_dd-premium-btn');
  if(lbl) lbl.textContent = '✦ You are Premium';
  if(btn){
    btn.classList.add('is-premium');
    btn.onclick = (e)=>{ e.stopPropagation(); _showToast('⚡ You already have Premium!'); _closeDD(); };
  }
}

/* ── open / close ── */
function openPremiumModal(){
  if(_isPremium){ _showToast('⚡ You are already Premium!'); _closeDD(); return; }
  document.getElementById('pm-overlay').classList.add('open');
  document.body.style.overflow='hidden';
  _closeDD();
}
function closePremiumModal(){
  document.getElementById('pm-overlay').classList.remove('open');
  document.body.style.overflow='';
}

/* ── plan selection ── */
function pmSelectPlan(plan){
  _pmPlan = plan;
  document.getElementById('pm-plan-monthly').classList.toggle('sel', plan==='monthly');
  document.getElementById('pm-plan-annual').classList.toggle('sel',  plan==='annual');
}

/* ── card formatters ── */
function pmFmtCard(el){
  let v=el.value.replace(/\D/g,'').substring(0,16);
  el.value=v.replace(/(\d{4})(?=\d)/g,'$1 ');
}
function pmFmtExpiry(el){
  let v=el.value.replace(/\D/g,'').substring(0,4);
  if(v.length>2) v=v.slice(0,2)+' / '+v.slice(2);
  el.value=v;
}

/* ── submit ── */
function pmSubmit(){
  const name   = (document.getElementById('pm-name')?.value||'').trim();
  const number = (document.getElementById('pm-number')?.value||'').replace(/\s/g,'');
  const expiry = (document.getElementById('pm-expiry')?.value||'').trim();
  const cvv    = (document.getElementById('pm-cvv')?.value||'').trim();

  if(!name||!number||!expiry||!cvv){
    _showToast('Please fill in all card fields.');
    return;
  }

  // Grant premium
  _isPremium = true;
  const sess = _getSession();
  if(sess){
    const uk = sess.username.replace(/\./g,'_');
    localStorage.setItem('pb_premium_'+uk,'true');
    // Write to Firebase silently
    if(typeof _fbDb!=='undefined'&&_fbDb){
      _fbDb.ref('pb_premium/'+uk).set({
        active:true, plan:_pmPlan, since:Date.now(), cardLast4:number.slice(-4)
      }).catch(()=>{});
    }
  }

  // Close modal, update UI, show congrats
  closePremiumModal();
  _applyPremiumUI();
  pmShowCongrats();
}

/* ── congrats ── */
function pmShowCongrats(){
  const el = document.getElementById('pm-congrats');
  el.classList.add('show');
  pmFireConfetti();
}

function pmCloseCongrats(){
  document.getElementById('pm-congrats').classList.remove('show');
  document.body.style.overflow='';
  // Scroll to catalogue
  const sections = document.querySelector('.sections');
  if(sections) sections.scrollIntoView({behavior:'smooth'});
}

function pmFireConfetti(){
  const colours=['#d4893c','#f0a84e','#5a9e6f','#f5ede0','#c4701a','#8aabdf'];
  for(let i=0;i<90;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='confetti-particle';
      el.style.cssText=`
        left:${Math.random()*100}vw;
        top:-10px;
        background:${colours[Math.floor(Math.random()*colours.length)]};
        width:${6+Math.random()*8}px;
        height:${6+Math.random()*8}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        animation-duration:${2+Math.random()*2}s;
        animation-delay:0s;
      `;
      document.body.appendChild(el);
      el.addEventListener('animationend',()=>el.remove());
    }, Math.random()*1200);
  }
}

// Dummy session fallback helper to prevent initialization crashes if not defined elsewhere
function _getSession() {
  return window._session || { username: "guest.user" };
}
function _showToast(msg) { alert(msg); }
function _closeDD() {
  document.getElementById('profile-dropdown')?.classList.remove('open');
}
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
