<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagebound — Reader</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0906;--surface:#16100a;--amber:#d4893c;--amber-light:#f0a84e;
  --cream:#f5ede0;--text:#e8ddd0;--text-dim:#8a7258;--border:rgba(184,148,104,.2);
  --green:#5a9e6f;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);}
body{display:flex;flex-direction:column;overflow:hidden;}

/* TOP BAR */
.reader-bar{height:52px;background:rgba(13,9,6,.97);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 1rem;gap:.8rem;flex-shrink:0;z-index:100;}
.rb-back{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;
  padding:.35rem .8rem;font-size:.78rem;color:var(--text-dim);cursor:pointer;text-decoration:none;
  transition:background .15s;display:flex;align-items:center;gap:.4rem;}
.rb-back:hover{background:rgba(255,255,255,.12);color:var(--cream);}
.rb-title-wrap{flex:1;min-width:0;}
.rb-title{font-family:'Playfair Display',serif;font-size:.92rem;font-weight:700;color:var(--cream);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rb-author{font-size:.7rem;color:var(--text-dim);}
.rb-controls{display:flex;align-items:center;gap:.4rem;margin-left:auto;}
.rb-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:7px;
  padding:.3rem .65rem;font-size:.75rem;color:var(--text-dim);cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.rb-btn:hover{background:rgba(255,255,255,.1);color:var(--cream);}
.rb-btn.on{background:var(--amber);color:#060408;border-color:var(--amber);}
.rb-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}

/* MAIN */
.reader-main{flex:1;display:flex;overflow:hidden;position:relative;}

/* TOC SIDEBAR */
.toc-sidebar{width:0;overflow:hidden;background:var(--surface);border-right:1px solid var(--border);
  transition:width .25s;flex-shrink:0;}
.toc-sidebar.open{width:240px;}
.toc-inner{width:240px;padding:.8rem;overflow-y:auto;height:100%;}
.toc-heading{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--text-dim);margin-bottom:.6rem;padding:.2rem 0;}
.toc-item{display:block;padding:.45rem .6rem;font-size:.78rem;color:var(--text-dim);
  border-radius:7px;cursor:pointer;transition:background .15s,color .15s;line-height:1.35;}
.toc-item:hover{background:rgba(255,255,255,.06);color:var(--cream);}
.toc-item.active{background:rgba(212,137,60,.12);color:var(--amber);}
.toc-sub{padding-left:1rem;font-size:.72rem;}

/* READER AREA */
.reader-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* ACTUAL CONTENT - scrollable chapter display */
.chapter-view{flex:1;overflow-y:auto;overflow-x:hidden;padding:2rem 1.5rem;
  scrollbar-width:thin;scrollbar-color:rgba(184,148,104,.3) transparent;}
.chapter-view::-webkit-scrollbar{width:5px;}
.chapter-view::-webkit-scrollbar-track{background:transparent;}
.chapter-view::-webkit-scrollbar-thumb{background:rgba(184,148,104,.3);border-radius:5px;}

/* Chapter content container */
#chapter-content{
  max-width:680px;margin:0 auto;
  font-family:'Merriweather',serif;font-size:1rem;line-height:1.85;color:#d4c4ae;
}
#chapter-content h1,#chapter-content h2,#chapter-content h3{
  font-family:'Playfair Display',serif;color:var(--cream);
  margin:1.8rem 0 .9rem;line-height:1.3;
}
#chapter-content h1{font-size:1.6rem;}
#chapter-content h2{font-size:1.25rem;}
#chapter-content h3{font-size:1.05rem;}
#chapter-content p{margin-bottom:1.1rem;text-indent:1.5em;}
#chapter-content p:first-child,#chapter-content p:first-of-type{text-indent:0;}
#chapter-content img{max-width:100%;border-radius:6px;margin:1rem auto;display:block;}
#chapter-content a{color:var(--amber);text-decoration:none;}
#chapter-content blockquote{border-left:3px solid var(--amber);padding-left:1rem;
  color:var(--text-dim);font-style:italic;margin:1rem 0;}

/* CHAPTER NAV */
.chapter-nav{display:flex;align-items:center;justify-content:space-between;
  padding:.6rem 1rem;background:rgba(13,9,6,.8);border-top:1px solid var(--border);flex-shrink:0;}
.ch-btn{display:flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.05);
  border:1px solid var(--border);border-radius:8px;padding:.42rem .9rem;
  font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--text-dim);cursor:pointer;
  transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;}
.ch-btn:hover:not(:disabled){background:rgba(255,255,255,.1);color:var(--cream);}
.ch-btn:disabled{opacity:.3;cursor:default;}
.ch-info{text-align:center;}
.ch-title{font-size:.78rem;font-weight:600;color:var(--cream);max-width:250px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-progress{font-size:.65rem;color:var(--text-dim);margin-top:.15rem;}
.progress-bar{width:80px;height:3px;background:rgba(255,255,255,.1);
  border-radius:3px;overflow:hidden;margin:.25rem auto 0;}
.progress-fill{height:100%;background:var(--amber);border-radius:3px;transition:width .3s;}

/* LOADING */
.loading-screen{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1rem;background:var(--bg);z-index:50;}
.loading-cover{width:70px;height:105px;border-radius:3px 10px 10px 3px;
  animation:float 2s ease-in-out infinite;box-shadow:4px 6px 20px rgba(0,0,0,.7);}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.loading-bar-wrap{width:160px;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.loading-bar-fill{height:100%;background:var(--amber);border-radius:3px;
  animation:loadpulse 1.6s ease-in-out infinite;}
@keyframes loadpulse{0%{width:0%;margin-left:0;}60%{width:60%;margin-left:20%;}100%{width:0%;margin-left:100%;}}
#loading-msg{font-size:.82rem;color:var(--text-dim);text-align:center;line-height:1.6;}

/* ERROR */
.error-screen{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:.7rem;background:var(--bg);
  z-index:50;padding:2rem;text-align:center;}
.err-icon{font-size:3rem;opacity:.5;}
.err-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--cream);}
.err-msg{font-size:.82rem;color:var(--text-dim);line-height:1.65;max-width:420px;}
.err-link{color:var(--amber);text-decoration:none;font-size:.84rem;}
.err-retry{margin-top:.6rem;background:var(--amber);border:none;border-radius:8px;
  padding:.5rem 1.4rem;font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:700;
  color:#060408;cursor:pointer;}

/* THEMES */
body.sepia .chapter-view{background:#f4ecd8;}
body.sepia #chapter-content{color:#3a2a14;}
body.sepia #chapter-content h1,body.sepia #chapter-content h2,body.sepia #chapter-content h3{color:#1a0e04;}
body.night .chapter-view{background:#0a0a0a;}
body.night #chapter-content{color:#aaaaaa;}

/* TOAST */
.toast{position:fixed;bottom:4rem;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--amber);color:#060408;border-radius:10px;padding:.48rem 1.2rem;
  font-size:.78rem;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .rb-author,.rb-sep,.rb-btn:not(.rb-toc-btn){display:none;}
  .toc-sidebar.open{width:200px;}
  .chapter-view{padding:1.2rem .9rem;}
}
</style>
</head>
<body>

<div class="reader-bar">
  <a class="rb-back" href="index.html">← Library</a>
  <div class="rb-title-wrap">
    <div class="rb-title" id="rb-title">Loading…</div>
    <div class="rb-author" id="rb-author"></div>
  </div>
  <div class="rb-controls">
    <button class="rb-btn rb-toc-btn" onclick="toggleToc()">☰ Contents</button>
    <div class="rb-sep"></div>
    <button class="rb-btn" onclick="changeFontSize(-1)">A−</button>
    <button class="rb-btn" onclick="changeFontSize(1)">A+</button>
    <div class="rb-sep"></div>
    <button class="rb-btn" onclick="setTheme('default')" id="th-default">🌙</button>
    <button class="rb-btn" onclick="setTheme('sepia')"   id="th-sepia">📜</button>
    <button class="rb-btn" onclick="setTheme('night')"   id="th-night">⬛</button>
    <div class="rb-sep"></div>
    <button class="rb-btn" onclick="bookmarkChapter()" title="Bookmark">🔖</button>
  </div>
</div>

<div class="reader-main">

  <!-- TOC -->
  <div class="toc-sidebar" id="toc-sidebar">
    <div class="toc-inner">
      <div class="toc-heading">Contents</div>
      <div id="toc-list"></div>
    </div>
  </div>

  <!-- READER AREA -->
  <div class="reader-area">

    <!-- Loading -->
    <div class="loading-screen" id="loading-screen">
      <div class="loading-cover" id="load-cover" style="background:linear-gradient(160deg,#3d2810,#6e4820)"></div>
      <div class="loading-bar-wrap"><div class="loading-bar-fill"></div></div>
      <div id="loading-msg">Loading book…</div>
    </div>

    <!-- Error -->
    <div class="error-screen" id="error-screen">
      <div class="err-icon">📚</div>
      <div class="err-title">Book not available</div>
      <div class="err-msg" id="err-msg">This book doesn't have an epub file yet.</div>
      <a class="err-link" href="index.html">← Back to Library</a>
      <button class="err-retry" id="err-retry" onclick="retryLoad()">↺ Retry</button>
    </div>

    <!-- Chapter content -->
    <div class="chapter-view" id="chapter-view" style="display:none">
      <div id="chapter-content"></div>
    </div>

    <!-- Chapter nav -->
    <div class="chapter-nav" id="chapter-nav" style="display:none">
      <button class="ch-btn" id="btn-prev" onclick="prevChapter()">‹ Previous</button>
      <div class="ch-info">
        <div class="ch-title" id="ch-title-display"></div>
        <div class="ch-progress" id="ch-progress">Chapter 1 of 1</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <button class="ch-btn" id="btn-next" onclick="nextChapter()">Next ›</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════
   FIREBASE
═══════════════════════════════════════ */
const FB = {
  apiKey:            "AIzaSyCTfeRsHZHr8NKrZPTSoDhG0LcgxA3mtzU",
  authDomain:        "casey-80b19.firebaseapp.com",
  databaseURL:       "https://casey-80b19-default-rtdb.firebaseio.com",
  projectId:         "casey-80b19",
  storageBucket:     "casey-80b19.firebasestorage.app",
  messagingSenderId: "1084195161725",
  appId:             "1:1084195161725:web:c4db255376c0aaf25d5314"
};
firebase.initializeApp(FB);
const db = firebase.database();

function getSession(){ try{return JSON.parse(localStorage.getItem('pb_session')||'null');}catch{return null;} }
const SESSION = getSession();

/* ═══════════════════════════════════════
   URL PARAMS
═══════════════════════════════════════ */
const params      = new URLSearchParams(window.location.search);
const EPUB_KEY    = params.get('key')||'';
const BOOK_TITLE  = params.get('title')||'';
const BOOK_AUTHOR = params.get('author')||'';
const BOOK_COLOR  = params.get('color')||'linear-gradient(160deg,#3d2810,#6e4820)';
const SAVE_KEY    = 'pb_ch_'+(EPUB_KEY||'unknown');

document.getElementById('rb-title').textContent  = BOOK_TITLE  || 'Loading…';
document.getElementById('rb-author').textContent = BOOK_AUTHOR || '';
document.getElementById('load-cover').style.background = BOOK_COLOR;
document.title = BOOK_TITLE ? `${BOOK_TITLE} — Pagebound` : 'Pagebound Reader';

/* ═══════════════════════════════════════
   READER STATE
═══════════════════════════════════════ */
let spine      = [];   // array of {href, title, id} from epub
let currentIdx = 0;
let zip        = null; // JSZip instance
let opfDir     = '';
let fontSize   = 100;
let theme      = 'default';
let toc        = [];

/* ═══════════════════════════════════════
   LOAD EPUB FROM FIREBASE
═══════════════════════════════════════ */
function setMsg(msg){ document.getElementById('loading-msg').textContent = msg; }

function showError(msg){
  document.getElementById('loading-screen').style.display = 'none';
  const es = document.getElementById('error-screen');
  es.style.display = 'flex';
  document.getElementById('err-msg').textContent = msg;
}

function retryLoad(){
  document.getElementById('error-screen').style.display = 'none';
  document.getElementById('loading-screen').style.display = 'flex';
  loadEpub();
}

async function loadEpub(){
  if(!EPUB_KEY){ showError('No book key provided.'); return; }

  // Try multiple key formats
  const keysToTry = [
    EPUB_KEY,
    EPUB_KEY.toLowerCase().replace(/[^a-z0-9]/g,'_'),
    BOOK_TITLE.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').substring(0,40),
  ].filter((k,i,a)=>k&&a.indexOf(k)===i);

  let meta=null, resolvedKey='';
  setMsg('Connecting to database…');
  for(const k of keysToTry){
    try{
      const snap = await db.ref('pb_books_epub/'+k+'/meta').once('value');
      if(snap.val()){ meta=snap.val(); resolvedKey=k; break; }
    }catch(e){}
  }
  if(!meta){ showError('No epub found for this book.\nThe admin needs to upload the epub file.'); return; }

  const totalChunks = meta.chunks||1;
  const kb = Math.round((meta.totalSize||0)*0.75/1024);
  setMsg(`Loading book (${kb} KB)…`);

  // Load chunks → Uint8Array slices
  const byteArrays = [];
  let totalBytes = 0;
  for(let i=0;i<totalChunks;i++){
    setMsg(`Loading part ${i+1} of ${totalChunks}…`);
    try{
      const snap = await db.ref('pb_books_epub/'+resolvedKey+'/chunk_'+i).once('value');
      const b64  = snap.val();
      if(!b64) throw new Error('chunk_'+i+' missing');
      const bin  = atob(b64);
      const bytes= new Uint8Array(bin.length);
      for(let j=0;j<bin.length;j++) bytes[j]=bin.charCodeAt(j);
      byteArrays.push(bytes);
      totalBytes+=bytes.length;
    }catch(e){ showError('Failed on chunk '+(i+1)+': '+e.message); return; }
  }

  // Merge into single ArrayBuffer
  setMsg('Assembling book…');
  const merged=new Uint8Array(totalBytes);
  let offset=0;
  for(const arr of byteArrays){ merged.set(arr,offset); offset+=arr.length; }

  // Parse epub with JSZip directly — NO epub.js dependency
  setMsg('Parsing epub…');
  try{
    zip = await JSZip.loadAsync(merged.buffer);
  }catch(e){ showError('Could not parse epub file: '+e.message); return; }

  // Parse OPF spine
  setMsg('Reading chapters…');
  try{
    await parseEpub();
  }catch(e){ showError('Could not read epub structure: '+e.message); return; }

  // Show reader
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('chapter-view').style.display='';
  document.getElementById('chapter-nav').style.display='flex';

  // Restore saved chapter
  const saved = parseInt(localStorage.getItem(SAVE_KEY)||'0');
  currentIdx = (saved >= 0 && saved < spine.length) ? saved : 0;

  await renderChapter(currentIdx);
}

/* ═══════════════════════════════════════
   EPUB PARSING (pure JSZip — no epub.js)
═══════════════════════════════════════ */
async function parseEpub(){
  // Find container.xml → OPF path
  const containerXml = await zip.file('META-INF/container.xml').async('text');
  const opfMatch = containerXml.match(/full-path="([^"]+\.opf)"/i);
  if(!opfMatch) throw new Error('OPF not found in container.xml');
  const opfPath = opfMatch[1];
  opfDir = opfPath.includes('/') ? opfPath.substring(0,opfPath.lastIndexOf('/')+1) : '';

  // Parse OPF
  const opfText = await zip.file(opfPath).async('text');
  const parser  = new DOMParser();
  const opfDoc  = parser.parseFromString(opfText,'application/xml');

  // Build manifest map: id → href
  const manifest = {};
  opfDoc.querySelectorAll('manifest item').forEach(item=>{
    manifest[item.getAttribute('id')] = item.getAttribute('href');
  });

  // Build spine from itemref order
  spine = [];
  opfDoc.querySelectorAll('spine itemref').forEach(ref=>{
    const idref = ref.getAttribute('idref');
    const href  = manifest[idref];
    if(href) spine.push({ id:idref, href: opfDir+href, title:'' });
  });

  if(spine.length===0) throw new Error('No chapters found in spine');

  // Try to get TOC (ncx or nav)
  await parseToc(opfDoc, manifest);
}

async function parseToc(opfDoc, manifest){
  // Try epub3 nav first
  let navItem = null;
  opfDoc.querySelectorAll('manifest item').forEach(item=>{
    if(item.getAttribute('properties')==='nav') navItem=item;
  });

  if(navItem){
    try{
      const navPath = opfDir + navItem.getAttribute('href');
      const navText = await zip.file(navPath).async('text');
      const navDoc  = new DOMParser().parseFromString(navText,'text/html');
      toc = [];
      navDoc.querySelectorAll('nav[epub\\:type="toc"] a, nav li a').forEach(a=>{
        const href = a.getAttribute('href')||'';
        const base = href.split('#')[0];
        const spIdx= spine.findIndex(s=>s.href.endsWith(base)||s.href===opfDir+base);
        toc.push({ label:a.textContent.trim(), spineIdx:spIdx>=0?spIdx:0, href });
        // Label spine items
        if(spIdx>=0 && !spine[spIdx].title) spine[spIdx].title=a.textContent.trim();
      });
    }catch(e){}
  }

  // Fallback: ncx
  if(toc.length===0){
    const ncxId = opfDoc.querySelector('spine')?.getAttribute('toc');
    if(ncxId && manifest[ncxId]){
      try{
        const ncxPath = opfDir+manifest[ncxId];
        const ncxText = await zip.file(ncxPath).async('text');
        const ncxDoc  = new DOMParser().parseFromString(ncxText,'application/xml');
        toc=[];
        ncxDoc.querySelectorAll('navPoint').forEach(np=>{
          const label = np.querySelector('navLabel text')?.textContent?.trim()||'';
          const src   = np.querySelector('content')?.getAttribute('src')||'';
          const base  = src.split('#')[0];
          const spIdx = spine.findIndex(s=>s.href.endsWith(base)||s.href===opfDir+base);
          toc.push({label,spineIdx:spIdx>=0?spIdx:0,href:src});
          if(spIdx>=0 && !spine[spIdx].title) spine[spIdx].title=label;
        });
      }catch(e){}
    }
  }

  // Label any remaining unlabelled spine items
  spine.forEach((s,i)=>{ if(!s.title) s.title='Chapter '+(i+1); });

  // Build TOC sidebar
  buildTocSidebar();
}

function buildTocSidebar(){
  const list = document.getElementById('toc-list');
  const items = toc.length ? toc : spine.map((s,i)=>({label:s.title,spineIdx:i}));
  list.innerHTML = items.map((item,i)=>`
    <div class="toc-item" id="toc-item-${i}" onclick="gotoTocItem(${item.spineIdx})">
      ${escHtml(item.label)}
    </div>`).join('');
}

function gotoTocItem(spineIdx){
  if(spineIdx<0||spineIdx>=spine.length) return;
  renderChapter(spineIdx);
  if(window.innerWidth<700) toggleToc();
}

/* ═══════════════════════════════════════
   RENDER CHAPTER
═══════════════════════════════════════ */
async function renderChapter(idx){
  if(!spine[idx]) return;
  currentIdx = idx;
  const ch = spine[idx];

  // Get the file from zip
  const filePath = ch.href;
  let htmlText='';
  try{
    // Try exact path, then without leading slash
    const f = zip.file(filePath) || zip.file(filePath.replace(/^\//,''));
    if(!f) throw new Error('File not found: '+filePath);
    htmlText = await f.async('text');
  }catch(e){
    document.getElementById('chapter-content').innerHTML=
      '<p style="color:var(--text-dim);font-style:italic;">Chapter not readable: '+e.message+'</p>';
    updateNav(); return;
  }

  // Parse the chapter HTML
  const doc = new DOMParser().parseFromString(htmlText,'text/html');

  // Remove scripts and style from chapter
  doc.querySelectorAll('script,style,link').forEach(el=>el.remove());

  // Fix images — convert relative paths to zip data URLs
  const imgs = doc.querySelectorAll('img');
  await Promise.all([...imgs].map(async img=>{
    const src = img.getAttribute('src')||'';
    if(src.startsWith('data:')||src.startsWith('http')) return;
    const chDir = filePath.includes('/') ? filePath.substring(0,filePath.lastIndexOf('/')+1):'';
    // Resolve relative path
    let imgPath = src.startsWith('/') ? src.slice(1) : chDir+src;
    imgPath = imgPath.replace(/[^/]+\/\.\.\//g,''); // normalise ../ 
    const imgFile = zip.file(imgPath);
    if(imgFile){
      try{
        const ext = imgPath.split('.').pop().toLowerCase();
        const mime = ext==='png'?'image/png':ext==='gif'?'image/gif':'image/jpeg';
        const b64  = await imgFile.async('base64');
        img.src = `data:${mime};base64,${b64}`;
      }catch(e){ img.remove(); }
    } else { img.remove(); }
  }));

  // Get body content
  const body = doc.body;
  document.getElementById('chapter-content').innerHTML = body ? body.innerHTML : '<p>Empty chapter.</p>';

  // Scroll to top
  document.getElementById('chapter-view').scrollTo({top:0,behavior:'instant'});

  // Save progress
  localStorage.setItem(SAVE_KEY, String(idx));
  if(SESSION && db){
    db.ref('pb_reading_progress/'+SESSION.username.replace(/\./g,'_')+'/'+EPUB_KEY)
      .set({chapter:idx,total:spine.length,pct:Math.round(idx/spine.length*100),updatedAt:Date.now()})
      .catch(()=>{});
  }

  updateNav();
  updateTocHighlight();
  applyFontSize();
}

function updateNav(){
  const el = id=>document.getElementById(id);
  el('ch-title-display').textContent = spine[currentIdx]?.title||'';
  el('ch-progress').textContent = `Chapter ${currentIdx+1} of ${spine.length}`;
  const pct = spine.length>1 ? Math.round(currentIdx/(spine.length-1)*100) : 100;
  el('progress-fill').style.width = pct+'%';
  el('btn-prev').disabled = currentIdx===0;
  el('btn-next').disabled = currentIdx===spine.length-1;
}

function updateTocHighlight(){
  document.querySelectorAll('.toc-item').forEach((el,i)=>{
    // Find which toc item corresponds to current spine index
    const items = toc.length ? toc : spine.map((_,idx)=>({spineIdx:idx}));
    el.classList.toggle('active', items[i]?.spineIdx===currentIdx);
  });
}

function prevChapter(){ if(currentIdx>0) renderChapter(currentIdx-1); }
function nextChapter(){ if(currentIdx<spine.length-1) renderChapter(currentIdx+1); }

/* ═══════════════════════════════════════
   UI CONTROLS
═══════════════════════════════════════ */
function toggleToc(){
  document.getElementById('toc-sidebar').classList.toggle('open');
}

function changeFontSize(dir){
  fontSize = Math.max(75,Math.min(150,fontSize+(dir*10)));
  applyFontSize();
  showToast('Font: '+fontSize+'%');
}
function applyFontSize(){
  document.getElementById('chapter-content').style.fontSize=fontSize+'%';
}

function setTheme(t){
  theme=t;
  document.body.className=t==='default'?'':''+t;
  document.querySelectorAll('[id^="th-"]').forEach(b=>b.classList.remove('on'));
  document.getElementById('th-'+t).classList.add('on');
}

function bookmarkChapter(){
  showToast('🔖 Chapter '+(currentIdx+1)+' bookmarked!');
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove('show'),2500);
}

// Keyboard nav
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') nextChapter();
  if(e.key==='ArrowLeft')  prevChapter();
});

// Swipe
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>60){ if(dx<0)nextChapter(); else prevChapter(); }
},{passive:true});

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
loadEpub();
</script>
</body>
</html>
